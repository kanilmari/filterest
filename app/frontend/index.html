<!-- index.html -->
<!DOCTYPE html>
<html lang="{{.LangCode}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Disable automatic phone number detection for better design control -->
    <meta name="format-detection" content="telephone=no">

    <!-- Dynamic SEO meta tags (populated by Go template from seo_meta_helpers.go) -->
    <title>{{.PageTitle}}</title>
    <meta name="description" content="{{.MetaDescription}}">
    <link rel="canonical" href="{{.CanonicalURL}}">
    {{if .RobotsNoIndex}}<meta name="robots" content="noindex, nofollow">{{end}}

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{{.OGType}}">
    <meta property="og:title" content="{{.OGTitle}}">
    <meta property="og:description" content="{{.OGDescription}}">
    <meta property="og:url" content="{{.OGURL}}">
    <meta property="og:image" content="{{.OGImage}}">
    <meta property="og:locale" content="{{.OGLocale}}">
    <meta property="og:site_name" content="{{.SiteName}}">
    <meta name="project-logo-path" content="{{.ProjectLogoPath}}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{.OGTitle}}">
    <meta name="twitter:description" content="{{.OGDescription}}">
    <meta name="twitter:image" content="{{.OGImage}}">

    <!-- Add to home screen for Safari on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Add to home screen for Chrome on Android -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- 🔑 välitetään nonce metaan, jotta JS löytää sen -->
    <meta name="csp-nonce" content="{{ .CSPNonce }}">
    <!-- Ympäristötieto frontille (dev/prod) -->
    <meta name="app-env" content="{{if .IsDev}}dev{{else}}prod{{end}}">
    <!-- First Runissa valittu käyttötarkoitus; ei muuta prosessin turvallisuustasoa. -->
    <meta name="installation-environment" content="{{.InstallationEnvironment}}">

    <link rel="icon" type="image/png" sizes="16x16" href="{{.FaviconPath}}">
    {{/* dev_error_forwarder is now loaded as ES module import in main.js */}}
    <script id="site-presentation-bootstrap" nonce="{{ .CSPNonce }}">
    // First paint uses only validated local cache; no network dependency before CSS.
    // Only finite numeric HSL components from our versioned cache become CSS values.
    (() => {
        try {
            const cached = JSON.parse(localStorage.getItem('filterest_public_presentation_v1') || 'null');
            const brand = cached?.brand;
            if (cached?.schema_version !== 1 || !brand) return;
            const valid = (value, max) => Number.isFinite(value) && value >= 0 && value <= max;
            if (!valid(brand.hue, 360) || !valid(brand.saturation, 100) || !valid(brand.lightness, 100)) return;
            const root = document.documentElement;
            root.style.setProperty('--brand-hue', String(brand.hue));
            root.style.setProperty('--brand-sat', `${brand.saturation}%`);
            root.style.setProperty('--brand-light', `${brand.lightness}%`);
        } catch { /* Missing, blocked or corrupt storage keeps the normal first-visit fallback. */ }
    })();
    </script>
    {{if .UseMinifiedAssets}}
    <link rel="stylesheet" id="imports-css" href="{{.ImportsCSSPath}}">
    {{else}}
    <link rel="stylesheet" id="imports-css" href="/frontend/styles/imports.css">
    {{end}}
</head>

<body>
<!--[if IE]>
<div>Internet Explorer not supported. Download Brave browser and use it.</div>
<a href="https://brave.com/download/">Brave browser download</a>
<![endif]-->
    <div class="body_wrapper">
        <!-- Sisältö -->
        <div class="body_content">
            <!-- <div class="vertical-nav"> -->
            <button
                id="showMenuButton"
                type="button"
                aria-controls="navbar"
                aria-label="Menu"
                title="Menu"
            >☰</button>
            <div id="navbar" class="collapsed" role="navigation" aria-label="Primary navigation">
                <div class="top-button-bar">
                    <button
                        id="hideMenuButton"
                        type="button"
                        aria-controls="navbar"
                        aria-label="Menu"
                        title="Menu"
                    >☰</button>
                    <div class="nav-history-buttons">
                        <button id="navBackBtn" class="nav-history-btn" disabled title="Back">
                            <span class="nav-history-btn-icon nav-history-btn-icon--back" aria-hidden="true"></span>
                        </button>
                        <button id="navForwardBtn" class="nav-history-btn" disabled title="Forward">
                            <span class="nav-history-btn-icon nav-history-btn-icon--forward" aria-hidden="true"></span>
                        </button>
                    </div>
                    <button id="themeToggleBtn" class="smallButtons button"></button>
                    <div class="language-selection menu-language-selection"></div>
                </div>
                <div id="navbarAuthActions" class="navbar-auth-actions" aria-label="Account actions"></div>
                <div class="navtabs_relative navbar-tab-region">
                    <div id="navmenu" class="navtabs"></div>
                </div>
                <!-- <a href="/register_ndYOyXV0INOK3F" data-lang-key="register_a_companion"></a> -->
                <!-- <div id="session_debug"></div> -->
            </div>
            <!-- </div> -->

            <div id="tabs_container" class="navbar_hidden" role="main">
                <!-- Dynaamisesti generoidut taulukot ja näkymät tulevat tänne -->
            </div>
        </div>
    </div>
    <script id="initial-shell-bootstrap" nonce="{{ .CSPNonce }}">
    // Local shell state is ready before modules, without a blocking script request.
    // Keep this compatibility check ES5 so an unsupported browser can read its message.
    (function () {
        var userAgent = window.navigator.userAgent;
        var userLang = navigator.language || navigator.userLanguage || 'en';
        if (userAgent.indexOf('MSIE ') >= 0 || userAgent.indexOf('Trident/') >= 0) {
            document.body.innerHTML = userLang.toLowerCase().indexOf('fi') === 0
                ? '<h1>Hei IE-käyttäjä!</h1><p>Internet Explorer on vanhentunut selain. '
                    + 'Lataa jokin uudempi, esimerkiksi <a href="https://brave.com/download/">Brave</a>.</p>'
                : '<h1>Hello IE user!</h1><p>Your Internet Explorer browser is outdated. '
                    + 'Please install a more modern browser, for example <a href="https://brave.com/download/">Brave</a>.</p>';
            return;
        }

        var bodyContent = document.querySelector('.body_content');
        if (!bodyContent) return;
        var threshold = 1850;
        try {
            var rawBreakpoint = window.getComputedStyle(document.documentElement)
                .getPropertyValue('--navbar-breakpoint');
            var parsedBreakpoint = parseInt(rawBreakpoint, 10);
            if (isFinite(parsedBreakpoint)) threshold = parsedBreakpoint;
        } catch (error) { /* CSS unavailable: retain the shared layout fallback. */ }
        try {
            var isWide = window.innerWidth >= threshold;
            var storedVisibility = localStorage.getItem(isWide ? 'navVisibleWide' : 'navVisibleNarrow');
            var visible = storedVisibility !== null ? storedVisibility === 'true' : isWide;
            bodyContent.setAttribute('data-navbar-initial-open', visible ? 'true' : 'false');
        } catch (error) {
            bodyContent.setAttribute('data-navbar-initial-open', 'false');
        }
    })();
    </script>
    {{if .UseMinifiedAssets}}
    <script type="module" id="main-bundle" src="{{.MainBundlePath}}"></script>
    {{else}}
    <script type="module" id="main-bundle" src="/frontend/main.js"></script>
    {{end}}
</body>

</html>
