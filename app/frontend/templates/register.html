<!-- register.html -->
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="mobile-web-app-capable" content="yes">

    <title data-lang-key="register">Register</title>

    <!-- Käytetään samaa CSS-tiedostoa kuin login-sivulla -->
    <link rel="stylesheet" href="/frontend/core_components/auth/auth.css">
    <link rel="stylesheet" href="/frontend/styles/theme_transition.css">
</head>
<body>
    <form method="POST" action="{{.FormAction}}" class="auth-form" data-testid="register-form">
        <h2 data-lang-key="register"></h2>

        <label for="username" data-lang-key="username"></label>
        <input type="text" id="username" name="username" required data-testid="register-username">
        {{if .UsernameErr}}
        <p class="error" data-lang-key="{{.UsernameErr}}"></p>
        {{end}}

        <label for="password" data-lang-key="password"></label>
        <input type="password" id="password" name="password" required data-testid="register-password">

        <label for="email" data-lang-key="email"></label>
        <input type="email" id="email" name="email" required data-testid="register-email">
        {{if .EmailErr}}
        <p class="error" data-lang-key="{{.EmailErr}}"></p>
        {{end}}

        <fieldset class="first-run-choice-group" data-testid="register-verification-methods">
            <legend data-lang-key="first_run_verification_legend">Sign-in verification</legend>
            <div class="first-run-choice-grid">
                <label class="first-run-choice-card">
                    <input type="radio" name="verification_method" value="none" {{if eq .VerificationMethod "none"}}checked{{end}} required data-testid="register-verification-none">
                    <span class="first-run-choice-title" data-lang-key="verification_none">No additional verification</span>
                    <span class="first-run-choice-description" data-lang-key="verification_none_description">Sign in with username and password only.</span>
                </label>
                <label class="first-run-choice-card">
                    <input type="radio" name="verification_method" value="fixed_pin" {{if eq .VerificationMethod "fixed_pin"}}checked{{end}} required data-testid="register-verification-fixed-pin">
                    <span class="first-run-choice-title" data-lang-key="verification_fixed_pin">Fixed PIN</span>
                    <span class="first-run-choice-description" data-lang-key="verification_fixed_pin_description">Use the same private 4–8 digit PIN at every sign-in.</span>
                </label>
                {{if .EmailVerificationAvailable}}
                <label class="first-run-choice-card">
                    <input type="radio" name="verification_method" value="email" {{if eq .VerificationMethod "email"}}checked{{end}} required data-testid="register-verification-email">
                    <span class="first-run-choice-title" data-lang-key="verification_email">Email</span>
                    <span class="first-run-choice-description" data-lang-key="verification_email_description">Sends a one-time code through Postmark.</span>
                </label>
                {{end}}
            </div>
        </fieldset>

        <div class="first-run-method-fields" data-register-verification-fields="fixed_pin" hidden>
            <label for="fixed_pin" data-lang-key="fixed_pin">Fixed PIN</label>
            <input type="password" inputmode="numeric" id="fixed_pin" name="fixed_pin" minlength="4" maxlength="8" pattern="[0-9]{4,8}" autocomplete="new-password" data-testid="register-fixed-pin">
            <label for="confirm_fixed_pin" data-lang-key="confirm_fixed_pin">Confirm fixed PIN</label>
            <input type="password" inputmode="numeric" id="confirm_fixed_pin" name="confirm_fixed_pin" minlength="4" maxlength="8" pattern="[0-9]{4,8}" autocomplete="new-password" data-testid="register-fixed-pin-confirmation">
        </div>
        {{if .VerificationErr}}
        <p class="error" data-lang-key="{{.VerificationErr}}"></p>
        {{end}}

        <label for="full_name" data-lang-key="full_name"></label>
        <input type="text" id="full_name" name="full_name" required data-testid="register-full-name">

        <input type="hidden" id="csrf_token" name="csrf_token" value="{{.CSRFToken}}">

        <div id="submit">
            <input type="submit" class="saturate_on_hover" value="Rekisteröidy" data-lang-key="register" data-testid="register-submit">
        </div>
        {{if .GeneralErr}}
        <p class="error" data-lang-key="{{.GeneralErr}}"></p>
        {{end}}
    </form>
    <script type="module" src="/frontend/core_components/auth/register_page_builder.js"></script>
</body>
</html>
