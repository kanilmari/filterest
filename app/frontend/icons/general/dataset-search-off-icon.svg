<!-- dataset-search-off-icon.svg
     Defines Model D's search visibility toggle.
     Uses the ordinary magnifier with a masked strike gap so 22px stays legible.
     Loaded as a themed CSS mask under the application's image CSP.
     Adapted from Google's Material Icons search (Apache-2.0), via dataset-search-icon.svg: its magnifier is unchanged, a strike and its masked gap are added. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <mask id="search-strike">
    <rect width="24" height="24" fill="#fff"/>
    <path d="M2.5 18.5 18.5 2.5" stroke="#000" stroke-width="5"/>
  </mask>
  <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 14a4 4 0 110-8 4 4 0 010 8z" mask="url(#search-strike)"/>
  <path d="M2.5 18.5 18.5 2.5" stroke="currentColor" stroke-width="2"/>
</svg>
