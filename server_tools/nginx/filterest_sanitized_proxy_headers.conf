# filterest_sanitized_proxy_headers.conf
# Replaces incoming client-identity headers with nginx-verified address data.
# Bridges the real-IP boundary to the application's exact trusted proxy peer.
# Exists so untrusted forwarded values cannot split security or rate-limit state.

proxy_set_header CF-Connecting-IP "";
proxy_set_header Forwarded "";
proxy_set_header X-Client-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
