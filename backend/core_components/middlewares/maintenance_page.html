<!-- maintenance_page.html
     Self-contained maintenance mode page served by the Go middleware.
     Bridges the maintenance middleware and the end user's browser.
     Exists to display a branded "under maintenance" message with auto-refresh. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="60">
    <title>{{SITE_NAME}} — Maintenance</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    <style>
        :root {
            --brand-hue: 210;
            --brand-sat: 80%;
            --brand-light: 50%;
            --color-brand: hsl(var(--brand-hue) var(--brand-sat) var(--brand-light));
            --color-brand-light: hsl(var(--brand-hue) var(--brand-sat) 95%);
            --color-brand-dark: hsl(var(--brand-hue) var(--brand-sat) 30%);
            --bg: var(--color-brand-light);
            --card-bg: #fff;
            --text: #333;
            --text-muted: #555;
            --text-hint: #999;
            --shadow: rgba(0, 0, 0, 0.10);
            --spinner-track: var(--color-brand-light);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: hsl(var(--brand-hue) 20% 12%);
                --card-bg: hsl(var(--brand-hue) 15% 18%);
                --text: #e4e8ec;
                --text-muted: #b0b8c4;
                --text-hint: #7a8494;
                --shadow: rgba(0, 0, 0, 0.35);
                --spinner-track: hsl(var(--brand-hue) 20% 25%);
                --color-brand: hsl(var(--brand-hue) var(--brand-sat) 60%);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            transition: background 0.3s, color 0.3s;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 24px var(--shadow);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .card-header {
            background: var(--color-brand);
            padding: 2rem 2rem 1.5rem;
            color: #fff;
        }

        .card-header svg {
            width: 48px;
            height: 48px;
            margin-bottom: 0.75rem;
            opacity: 0.9;
        }

        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card-body {
            padding: 2rem 2rem 2.5rem;
        }

        .card-body p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--spinner-track);
            border-top-color: var(--color-brand);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .retry-note {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-hint);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <!-- wrench/gear icon (inline SVG, no external deps) -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42
                         15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655
                         5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164
                         1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004
                         3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.049
                         .58.024 1.194-.14 1.743" />
            </svg>
            <h1 id="heading">{{SITE_NAME}} is under maintenance</h1>
        </div>
        <div class="card-body">
            <p id="message">
                We are performing system maintenance.
                This page refreshes automatically. No need to reload manually.
            </p>
            <div class="spinner"></div>
            <p class="retry-note" id="retry">Auto-refresh every 60 seconds</p>
        </div>
    </div>
    <script>
        (function () {
            var t = {
                en: {
                    heading: "{{SITE_NAME}} is under maintenance",
                    message: "We are performing system maintenance. This page refreshes automatically. No need to reload manually.",
                    retry: "Auto-refresh every 60 seconds"
                },
                fi: {
                    heading: "{{SITE_NAME}} on huoltotilassa",
                    message: "Suoritamme j\u00e4rjestelm\u00e4huoltoa. Sivu p\u00e4ivittyy automaattisesti. Sinun ei tarvitse ladata sivua uudelleen.",
                    retry: "Automaattinen p\u00e4ivitys 60 sekunnin v\u00e4lein"
                }
            };
            var lang = (navigator.language || "en").slice(0, 2);
            var s = t[lang] || t.en;
            document.documentElement.lang = lang;
            document.getElementById("heading").textContent = s.heading;
            document.getElementById("message").textContent = s.message;
            document.getElementById("retry").textContent = s.retry;
        })();
    </script>
</body>
</html>
