# ==============================================================================
# docker-compose.traefik.yml: Traefik reverse proxy for multi-instance deployment
# 
# Usage:
#   docker compose -f docker/docker-compose.traefik.yml up -d
#
# This creates a shared Traefik instance that routes traffic to all Easelect
# instances based on their domain labels. Each instance (docker/docker-compose.instance.yml)
# connects to the 'traefik-network' and is automatically discovered.
#
# Architecture:
#   Internet → Traefik (:80, :443) → easelect-serlog.com:8082
#                                  → easelect-filterest.fi:8082
#                                  → easelect-example.com:8082
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Traefik Reverse Proxy
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    command:
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      
      # Docker provider - auto-discover containers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-network"
      
      # File provider for additional config
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      
      # Let's Encrypt certificates
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      # Docker socket for container discovery
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Persistent certificate storage
      - "traefik-certificates:/letsencrypt"
      # Dynamic configuration
      - "./traefik/dynamic:/etc/traefik/dynamic:ro"
      # Logs
      - "./traefik/logs:/var/log/traefik"
    
    networks:
      - traefik-network
    
    labels:
      # Dashboard routing (optional - comment out in production)
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${BASE_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      # Basic auth for dashboard (generate with: htpasswd -nb admin password)
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/}"

    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ==============================================================================
# Networks
# ==============================================================================
networks:
  traefik-network:
    name: traefik-network
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  traefik-certificates:
    name: traefik-certificates
